# Serves the console and proxies /v1 to the API: one origin, so the __Host- session cookie stays
# first-party and the browser never needs CORS. TLS and HSTS are handled by the edge proxy.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # No inline script or style is ever needed; data: images are the MFA QR codes, generated locally.
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  gzip on;
  gzip_types text/css application/javascript application/json application/problem+json image/svg+xml;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # The API counts proxy hops (TRUST_PROXY_HOPS) and keeps only the address appended here.
  location /v1/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64k;
  }

  # Fingerprinted by Vite: safe to cache forever.
  location /assets/ {
    expires 1y;
    access_log off;
  }

  # Client-side routing: unknown paths render the SPA. index.html itself is never cached.
  location / {
    try_files $uri /index.html;
    expires -1;
  }
}
